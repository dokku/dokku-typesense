---
services:
  typesense:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    # arguments to the image's own entrypoint. The api key is in the config file
    # rather than here, so it is not in the container's command line. Both
    # paths follow the volumes, so a service that moved one still finds it.
    command:
      - "--data-dir={{ .Target.data }}"
      - "--config={{ .Target.config }}/typesense-server.ini"

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/config"
        target: /etc/typesense
      - type: bind
        source: "{{ .HostRoot }}/data"
        target: /data

    configs:
      - source: typesense_server_ini
        target: /etc/typesense/typesense-server.ini

    ports:
      - name: native
        target: 8108
        primary: true

configs:
  typesense_server_ini:
    content: |
      [server]
      api-key = {{ .Secret.password }}

x-dokku:
  plugin: typesense
  title: Typesense
  scheme: typesense
  alias: TYPESENSE
  dsn: "{{ .Scheme }}://:{{ .Secret.password }}@{{ .Host }}:{{ .Port.native }}"

  # the image ships no client whose exit status could answer a healthcheck
  wait: native

  secrets:
    password:
      file: PASSWORD
      length: 64
      env: SERVICE_PASSWORD

      # the api key is in the seeded config file, which typesense only reads
      # as it starts, so the line in the file is written over with the service
      # down, keeping the rest of the file, its owner and its mode, and the
      # service is started again on it
      change:
        mode: offline
        user: "0"
        entrypoint: ""
        exec:
          - sh
          - -c
          - |
            set -e
            config="$1"
            updated="$(while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                api-key*) printf 'api-key = %s\n' "$NEW_PASSWORD" ;;
                *) printf '%s\n' "$line" ;;
              esac
            done < "$config")"
            case "$updated" in
              *"api-key = $NEW_PASSWORD"*) ;;
              *)
                echo "$config has no api-key line to change" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$updated" > "$config"
          - dokku-typesense-change-password
          - "{{ .Target.config }}/typesense-server.ini"
        env:
          NEW_PASSWORD: "{{ .NewSecret }}"

  # typesense speaks http rather than shipping a client, and holds its data in
  # its own format with no dump tool, so there is nothing to connect with and
  # nothing to export. Clone and the backup family fall out of that.
  commands:
    # beside the service, in an image dokku already ships that has python, since
    # the typesense image ships no client. The collections are deleted through
    # the api rather than the data directory emptied, which would take the keys
    # an app authenticates with along with them.
    reset:
      mode: sidecar
      image: dokku/s3backup:0.20.0
      exec: ["dokku-typesense-reset"]
      env:
        TYPESENSE_API_KEY: "{{ .Secret.password }}"
